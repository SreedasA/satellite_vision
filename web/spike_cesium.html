<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesium Shadow Spike</title>
  <!-- Phase 0 spike P0.8: extruded GeoJSON-style polygons + sun shadows, no Cesium ion. -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #viewer { margin: 0; width: 100%; height: 100%; background: #1b1f24; }
    #panel { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(20,24,28,.85);
             color: #e8e8e8; font: 13px/1.4 system-ui, sans-serif; padding: 10px 12px; border-radius: 6px; }
    #panel label { display: block; margin-top: 6px; }
    #status { margin-top: 8px; color: #9fd39f; white-space: pre; }
  </style>
</head>
<body>
<div id="viewer"></div>
<div id="panel">
  <b>Cesium shadow spike</b>
  <label>Hour (UTC) <input id="hour" type="range" min="11" max="23" step="0.25" value="15"> <span id="hourVal"></span></label>
  <label>Flood level (m) <input id="flood" type="range" min="0" max="10" step="0.5" value="0"> <span id="floodVal"></span></label>
  <div id="status">loading…</div>
</div>
<script>
  // No ion: no default imagery/terrain/geocoder, so nothing calls api.cesium.com.
  Cesium.Ion.defaultAccessToken = "";
  const viewer = new Cesium.Viewer("viewer", {
    baseLayer: false, baseLayerPicker: false, geocoder: false, terrain: undefined,
    timeline: false, animation: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, infoBox: true, shadows: true,
  });
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#3a4048");
  viewer.scene.globe.enableLighting = true;
  viewer.shadowMap.softShadows = true;
  viewer.shadowMap.size = 2048;

  // Hand-made test blocks near downtown Jacksonville (lon, lat, w_m, d_m, height_m).
  const lon0 = -81.6581, lat0 = 30.3270, mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(lat0 * Math.PI / 180);
  const blocks = [[0, 0, 40, 30, 60], [70, 10, 30, 30, 18], [0, 60, 50, 25, 9], [70, 70, 25, 40, 33], [-60, 20, 30, 50, 4]];
  const entities = blocks.map(([e, n, w, d, h], i) => {
    const toLL = (x, y) => [lon0 + x / mPerDegLon, lat0 + y / mPerDegLat];
    const ring = [[e, n], [e + w, n], [e + w, n + d], [e, n + d]].flatMap(([x, y]) => toLL(x, y));
    return viewer.entities.add({
      name: `Building ${i + 1}`,
      description: `Height ${h} m · ~${Math.round(h / 3)} floors`,
      properties: { height_m: h },
      polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray(ring),
        height: 0, extrudedHeight: h,
        material: Cesium.Color.fromCssColorString("#d9d4c7"),
        shadows: Cesium.ShadowMode.ENABLED,
      },
    });
  });
  // Ground plate so shadows have something to fall on.
  viewer.entities.add({
    rectangle: {
      coordinates: Cesium.Rectangle.fromDegrees(lon0 - 0.0012, lat0 - 0.0008, lon0 + 0.0018, lat0 + 0.0014),
      height: 0, material: Cesium.Color.fromCssColorString("#6d7a5e"), shadows: Cesium.ShadowMode.RECEIVE_ONLY,
    },
  });
  const water = viewer.entities.add({
    rectangle: {
      coordinates: Cesium.Rectangle.fromDegrees(lon0 - 0.0012, lat0 - 0.0008, lon0 + 0.0018, lat0 + 0.0014),
      height: 0.01, extrudedHeight: 0.02, material: Cesium.Color.fromCssColorString("#2f7fd6").withAlpha(0.55),
      show: false,
    },
  });

  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(lon0 - 0.0025, lat0 - 0.0035, 320),
    orientation: { heading: Cesium.Math.toRadians(25), pitch: Cesium.Math.toRadians(-30), roll: 0 },
  });

  const hour = document.getElementById("hour"), flood = document.getElementById("flood");
  function setHour() {
    const h = Number(hour.value);
    const d = new Date(Date.UTC(2026, 5, 21, Math.floor(h), Math.round((h % 1) * 60)));
    viewer.clock.currentTime = Cesium.JulianDate.fromDate(d);
    document.getElementById("hourVal").textContent = `${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, "0")}`;
  }
  function setFlood() {
    const lvl = Number(flood.value);
    document.getElementById("floodVal").textContent = lvl;
    water.show = lvl > 0;
    water.rectangle.extrudedHeight = Math.max(lvl, 0.02);
    let affected = 0;
    for (const e of entities) {
      const h = e.properties.height_m.getValue();
      const wet = lvl > 0;
      if (wet) affected++;
      e.polygon.material = wet ? Cesium.Color.fromCssColorString(h <= lvl ? "#c0392b" : "#e67e22")
                               : Cesium.Color.fromCssColorString("#d9d4c7");
    }
    report(affected);
  }
  function report(affected = 0) {
    const ionCalls = performance.getEntriesByType("resource").filter(r => r.name.includes("cesium.com")).length;
    document.getElementById("status").textContent =
      `buildings: ${entities.length}\nflood-affected: ${affected}\nshadows: ${viewer.shadows}\nion requests: ${ionCalls}`;
  }
  hour.oninput = setHour; flood.oninput = setFlood;
  setHour(); setFlood();
  window.spike = { viewer, report };
</script>
</body>
</html>
